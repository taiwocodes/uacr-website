<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UAC Restaurants</title>

  <!-- Basic SEO -->

  <meta name="description"
    content="UAC Restaurants brings you the best of Mr Bigg’s, Debonairs Pizza, and Supreme Ice Cream - fresh meals, delicious pastries, quality pizza, and premium ice cream enjoyed across Nigeria. Perfect for families, events, and everyday dining." />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <link rel="canonical" href="https://uacrestaurants.com/" />

  <!-- Favicons / PWA -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#022A68" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="UAC Restaurants" />
  <meta property="og:title" content="UAC Restaurants | Mr Bigg’s, Debonairs Pizza & Supreme Ice Cream" />
  <meta property="og:description"
    content="Enjoy the best of Mr Bigg’s meals, Debonairs Pizza favorites, and Supreme Ice Cream treats. Quality food, quick service, and catering for families, events, and everyday dining across Nigeria." />
  <meta property="og:url" content="https://uacrestaurants.com" />
  <meta property="og:image" content="https://uacrestaurants.com/logo.svg" />
  <meta property="og:image:alt" content="Mr Bigg’s meals, Debonairs Pizza, and Supreme Ice Cream treats" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="UAC Restaurants | Mr Bigg’s, Debonairs Pizza & Supreme Ice Cream" />
  <meta name="twitter:description"
    content="Enjoy delicious meals from Mr Bigg’s, signature pizzas from Debonairs Pizza, and premium treats from Supreme Ice Cream. Quality food and catering services across Nigeria." />
  <meta name="twitter:image" content="https://uacrestaurants.com/logo.svg" />

  <!-- Organization / Brand JSON-LD -->
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "UAC Restaurants",
  "url": "https://uacrestaurants.com/",
  "logo": "https://uacrestaurants.com/logo.svg",
  "description": "UAC Restaurants operates Mr Bigg’s, Debonairs Pizza, and Supreme Ice Cream across Nigeria, offering quality meals, pizza, pastries, desserts, and catering services.",
  "brand": [
    {
      "@type": "Brand",
      "name": "Mr Bigg’s",
      "logo": "https://uacrestaurants.com/mrbiggs-logo.png"
    },
    {
      "@type": "Brand",
      "name": "Debonairs Pizza",
      "logo": "https://uacrestaurants.com/debonairs-logo.png"
    },
    {
      "@type": "Brand",
      "name": "Supreme Ice Cream",
      "logo": "https://uacrestaurants.com/ice-cream-logo(2).png"
    }
  ],
  "sameAs": [
    "https://www.facebook.com/UACRestaurants",
    "https://www.instagram.com/uacrestaurants",
    "https://twitter.com/uacrestaurants"
  ]
}
</script>

</head>

<body>
  <noscript>For the best experience, please enable JavaScript.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
